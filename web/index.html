<style>
    /* pro-row / pro-grid had no rules at all: the professional panels' controls were plain inline elements,
       so they wrapped onto two lines as soon as the window was narrow. One row per item now. */
    .pro-row { display: flex; flex-wrap: nowrap; gap: 8px; align-items: center; margin-top: 8px; }
    .pro-row > * { min-width: 0; }
    .pro-row input, .pro-row select { flex: 1 1 120px; min-width: 90px; }
    .pro-row .button, .pro-row .pro-check { flex: 0 0 auto; }
    .pro-grid { display: grid; gap: 8px; align-items: center; margin-top: 8px; }
    .pro-grid > * { min-width: 0; }
    .pro-grid input, .pro-grid select { width: 100%; }
    .pro-check { display: inline-flex; align-items: center; gap: 4px; margin-right: 8px; white-space: nowrap; }
  
    /* Post-render polish: a sticky index beside the editor, and foldable panels. */
    .pro-editor-wrap { display: flex; gap: 14px; align-items: flex-start; margin-top: 10px; }
    .pro-toc { position: sticky; top: 12px; align-self: flex-start; flex: 0 0 208px; display: flex; flex-direction: column;
               gap: 4px; max-height: 80vh; overflow: auto; }
    .pro-toc a { font-size: 12px; text-decoration: none; color: inherit; opacity: .82; padding: 2px 0; }
    .pro-toc a:hover { opacity: 1; text-decoration: underline; }
    .pro-editor-wrap > #pro-editor { flex: 1 1 auto; min-width: 0; }
                                    background: rgba(127,127,127,.10); border-radius: 6px; }
    @media (max-width: 900px) { .pro-editor-wrap { gap: 8px; } .pro-toc { flex: 0 0 148px; font-size: 11px; } }

    /* Two audience groups inside the editor: the expert's own model vs what the caller must supply and obey. */
    .pro-group { border-radius: 8px; padding: 10px 12px 4px; margin-bottom: 14px; border: 1px solid transparent; }
    .pro-group-model { background: rgba(127,127,127,.06); border-color: rgba(127,127,127,.18); }
    .pro-group-caller { background: rgba(64,128,255,.07); border-color: rgba(64,128,255,.28); }
    .pro-group > .panel-title { margin: 0 0 2px; }
    .pro-toc-group { margin-bottom: 8px; display: flex; flex-direction: column; }
    /* Links must be block-level or they all sit on one line (which is how the index looked). */
    .pro-toc-group a { display: block; padding-left: 8px; }
    .pro-toc-title { font-size: 12px; font-weight: 700; opacity: .9; margin: 2px 0 3px; }

    /* Rule-style panels (a set of checkboxes plus a conclusion): one card per rule, two lines. */
    .pro-rules .pro-row { flex-wrap: wrap; border: 1px solid rgba(127,127,127,.22);
                          border-radius: 8px; padding: 8px 10px; margin-top: 10px; }
    .pro-rules .pro-checks { flex: 1 1 100%; display: flex; flex-wrap: wrap; gap: 6px 14px;
                             padding-bottom: 6px; border-bottom: 1px dashed rgba(127,127,127,.25); }
    .pro-rules .pro-check { white-space: nowrap; }
    .pro-rules .pro-row input[data-cr-conc], .pro-rules .pro-row input[data-ex-conc] { flex: 1 1 200px; }
    .pro-rules .pro-row .button { flex: 0 0 auto; }

    /* Item numbers inside each panel, so the panel reads 1, 2, 3 … like its index entry. */
    .pro-num { display: inline-flex; align-items: center; justify-content: center; flex: 0 0 auto;
               width: 20px; height: 20px; margin-right: 6px; border-radius: 50%;
               background: rgba(127,127,127,.16); font-size: 12px; font-weight: 600; }

    /* Inputs the judgment says are missing (convention B) get a red outline in the preview form. */
    .pro-missing { border-color: #d9534f !important; box-shadow: 0 0 0 2px rgba(217,83,79,.16) !important; }


    .pro-build { font-size: 11px; opacity: .6; margin-bottom: 4px; }

    /* D/E: the call contract and the composed delivery note, shown as pasteable text. */
    .pro-contract-bar { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; margin-top: 8px; }
    .pro-copy { white-space: pre-wrap; word-break: break-word; background: rgba(127,127,127,.08);
                border: 1px solid rgba(127,127,127,.22); border-radius: 8px; padding: 10px;
                font-size: 12px; line-height: 1.6; max-height: 340px; overflow: auto; margin: 6px 0 0; }
</style>
